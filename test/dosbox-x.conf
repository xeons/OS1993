# A plausible 1993 machine: 386, 16 MB RAM, SVGA, HIMEM-style XMS, no EMM386.
# The Makefile mounts build/ as C: and runs OS1993 from the command line.

[sdl]
autolock = false

[dosbox]
machine = svga_s3
memsize = 16

[cpu]
core    = normal
cputype = 386
cycles  = max

[dos]
xms = true
# EMS off: OS1993 needs real mode, not V86 mode under a memory manager.
ems = false
umb = false

[serial]
# COM1 is the kernel's debug console.
serial1 = file file:build/SERIAL.LOG

[autoexec]
